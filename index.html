<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Гараж — выживание</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0d;color:white;font:14px system-ui;display:grid;place-items:center;height:100vh}main{height:min(94vh,900px);aspect-ratio:9/16;position:relative;box-shadow:0 0 60px #000}canvas{width:100%;height:100%;display:block}button{position:absolute;top:12px;right:12px;background:#111b;color:white;border:1px solid #777;padding:9px}
</style><main><canvas></canvas><button>▶ Начать</button></main>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),b=document.querySelector('button');c.width=450;c.height=800;
let start=0,run=false,audio;
const scenes=[
[10,"СИРЕНЫ РАЗРЫВАЮТ ТИШИНУ","Экстренное сообщение: оставайтесь в укрытии."],
[20,"ОНИ У ВОРОТ","Закройте ворота. Не привлекайте внимание."],
[35,"ОЦЕНИ СВОИ РЕСУРСЫ","Вода • аптечка • фонарь • топливо"],
[55,"ГОТОВЬСЯ К ВЫХОДУ","Укрепи вход. Собери рюкзак. Проверь выход."],
[70,"ОПАСНОСТЬ ВНУТРИ","Отступай. Не позволяй загнать себя в угол."],
[90,"ПОРА УХОДИТЬ","Выбирай тихий маршрут и держись укрытий."]
];
function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}
function line(points,col,w=3){x.beginPath();points.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.strokeStyle=col;x.lineWidth=w;x.stroke()}
function draw(t){
let s=scenes.findIndex(q=>t<q[0]);if(s<0)s=5;
let shake=s===4?Math.sin(t*25)*5:0, zoom=1+Math.sin(t/5)*.012;
x.setTransform(zoom,0,0,zoom,shake,0);rect(-30,-30,520,850,'#111617');
let g=x.createLinearGradient(0,0,0,800);g.addColorStop(0,'#344044');g.addColorStop(1,'#090c0e');rect(0,0,450,800,g);
for(let i=0;i<7;i++){rect(i*70,90,2,610,'#394144');line([[0,130+i*65],[450,130+i*65]],'#252c2e',2)}
// garage door and slits
rect(12,110,112,390,'#252b2d');for(let y=130;y<490;y+=35)line([[14,y],[121,y]],'#596064',2);
if(s===1||s===5){rect(12,110,112,390,'#101213');line([[20,220],[115,220]],'#8a3827',2)}
// car
let bob=Math.sin(t*2)*2;
x.fillStyle='#172328';x.beginPath();x.moveTo(120,490);x.lineTo(145,415);x.quadraticCurveTo(165,370,245,375);x.lineTo(320,425);x.lineTo(355,490);x.closePath();x.fill();
rect(145,432,185,56,'#26383b');rect(175,394,75,35,'#526064');rect(260,410,45,20,'#526064');
for(let xx of [165,315]){x.beginPath();x.arc(xx,492,22,0,7);x.fillStyle='#090b0c';x.fill();x.beginPath();x.arc(xx,492,9,0,7);x.fillStyle='#727879';x.fill()}
 // shelves, supplies, workbench
rect(350,250,70,260,'#343331');for(let y=290;y<500;y+=55){rect(343,y,82,7,'#777064');rect(360,y-30,22,28,'#65714d');rect(390,y-25,20,23,'#8a7048')}
rect(25,570,390,18,'#644a35');rect(50,588,12,110,'#46382c');rect(390,588,12,110,'#46382c');
for(let i=0;i<8;i++)rect(45+i*43,545,20,24,i%2?'#9a814c':'#657548');
 // hero, moving toward door
let hx=225+Math.sin(t/3)*22-(s>4?70:0),hy=570+bob;
x.fillStyle='#16191a';x.beginPath();x.ellipse(hx,hy-95,22,31,0,0,7);x.fill();rect(hx-19,hy-65,38,80,'#42483f');line([[hx-12,hy+10],[hx-20,hy+65]],'#252a28',12);line([[hx+12,hy+10],[hx+21,hy+65]],'#252a28',12);
line([[hx-15,hy-45],[hx-48,hy-12]],'#42483f',10);line([[hx+15,hy-45],[hx+40,hy-20]],'#42483f',10);
// zombie silhouette; drifting smoke and light
if(s>=1){let zx=s===4?300+Math.sin(t*4)*25:45;line([[zx,510],[zx-8,550],[zx,590],[zx-12,630]],'#171818',18);line([[zx,545],[zx-28,570],[zx-35,600]],'#171818',10);x.fillStyle='#b84632';x.fillRect(zx-4,507,3,3)}
for(let i=0;i<12;i++){let xx=(i*83+t*9)%470,yy=(i*71-t*5+800)%800;x.globalAlpha=.08;x.beginPath();x.arc(xx,yy,12+i%4*8,0,7);x.fillStyle='#b5b3a2';x.fill()}x.globalAlpha=1;
let flick=s===0&&Math.sin(t*8)>0.8;rect(0,0,450,800,flick?'#a5b7a522':'#00000055');
x.setTransform(1,0,0,1,0,0);rect(0,0,450,150,'#0008');x.fillStyle='white';x.textAlign='center';x.font='bold 22px system-ui';x.fillText(scenes[s][1],225,55);x.font='15px system-ui';x.fillText(scenes[s][2],225,90);
if(t>86){rect(0,0,450,800,'#000b');x.font='bold 21px system-ui';x.fillText('ВЫЖИВАНИЕ — ЭТО НЕ СИЛА.',225,380);x.fillText('ЭТО ПРАВИЛЬНЫЕ РЕШЕНИЯ.',225,415)}
}
function frame(){if(run){let t=(performance.now()-start)/1000;if(t>90){run=false;b.textContent='↻ Повторить'}else draw(t)}requestAnimationFrame(frame)}
b.onclick=()=>{start=performance.now();run=true;b.textContent='Ⅱ Пауза';if(!audio){audio=new AudioContext();let o=audio.createOscillator(),gain=audio.createGain();o.type='sawtooth';o.frequency.value=48;gain.gain.value=.018;o.connect(gain).connect(audio.destination);o.start()}else if(audio.state==='suspended')audio.resume();draw(0)};
draw(0);frame();
</script></html>
