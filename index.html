<script type="module">
import * as THREE from 'three';
const canvas=document.querySelector('#scene'),$=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;

function building(x,z,w,h,d){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),concrete);b.position.y=h/2;b.castShadow=true;b.receiveShadow=true;g.add(b);const roof=new THREE.Mesh(new THREE.BoxGeometry(w*1.03,.2,d*1.03),dark);roof.position.y=h+.1;g.add(roof);for(let y=1.5;y<h-1;y+=2.2)for(let xw=-w/2+.7;xw<w/2-.3;xw+=1.35){if(rnd()<.17)continue;const win=new THREE.Mesh(new THREE.BoxGeometry(.5,.75,.04),glass);win.position.set(xw,y,d/2+.025);g.add(win);if(rnd()>.94)win.material=new THREE.MeshBasicMaterial({color:0x9b5b3b})}if(rnd()>.5){const pipe=new THREE.Mesh(new THREE.CylinderGeometry(.04,.06,3,6),dark);pipe.position.set((rnd()-.5)*w,h+1.5,0);g.add(pipe)}}

const n=1000,pos=new Float32Array(n*3),speed=new Float32Array(n);for(let i=0;i<n;i++){pos[i*3]=(rnd()-.5)*40;pos[i*3+1]=rnd()*24;pos[i*3+2]=(rnd()-.5)*75;speed[i]=.12+rnd()*.2}const rainGeo=new THREE.BufferGeometry();rainGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xb5c2c5,size:.07,transparent:true,opacity:.4}));scene.add(rain);

function frame(now){if(!playing)return;const t=Math.min(duration,(now-started)/1000),p=t/duration;camera.position.set(Math.sin(t*.22)*.65,5+Math.sin(t*.55)*.14,25-p*16);camera.lookAt(0,3,-16-p*5);siren.intensity=t>4&&t<12?48*(.35+.65*Math.sin(t*8)**2):0;infected.forEach((z,i)=>{z.root.visible=t>6;z.root.position.x=[-3,4,1][i]+Math.sin(t*1.2+i)*.18;z.root.position.z=[-34,-40,-29][i]+Math.max(0,t-6)*.65;z.limbs.forEach((l,j)=>l.rotation.z=Math.sin(t*3+z.phase+j)*.13)});survivor.root.visible=t>11;survivor.root.position.z=4-Math.max(0,t-11)*.1;const a=rainGeo.attributes.position;for(let i=0;i<n;i++){let y=a.array[i*3+1]-speed[i]*1.8;if(y<0)y=24;a.array[i*3+1]=y}a.needsUpdate=true;fogs.forEach((f,i)=>f.position.x=Math.sin(t*.18+i)*3);renderer.render(scene,camera);story(t);if(t>=duration){playing=false;return}raf=requestAnimationFrame(frame)}
