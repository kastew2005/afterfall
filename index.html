<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ПОСЛЕДНИЙ МАРШРУТ</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; color:#fff;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
#app { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#stage {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  aspect-ratio: 9/16; width:min(100vw, calc(100vh * 9 / 16)); max-height:100vh;
  overflow:hidden; background:#000;
}
#film { width:100%; height:100%; display:block; }

/* Cinematic overlays */
.vignette {
  position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.75) 100%);
  mix-blend-mode: multiply;
}
.grain {
  position:absolute; inset:0; pointer-events:none; opacity:0.07;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  animation: grainShift 0.15s steps(2) infinite;
}
@keyframes grainShift {
  0% { transform: translate(0,0); }
  100% { transform: translate(-10px, 8px); }
}
.letterbox { position:absolute; left:0; right:0; height:6%; background:#000; pointer-events:none; }
.letterbox.top { top:0; }
.letterbox.bottom { bottom:0; }
.fade { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:none; }

/* Subtitles */
.subtitle {
  position:absolute; left:8%; right:8%; bottom:14%; text-align:center;
  font-size:clamp(13px,3.5vmin,20px); font-weight:500; letter-spacing:0.05em;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 12px rgba(0,0,0,0.7);
  opacity:0; transition: opacity 0.4s ease; pointer-events:none; line-height:1.35;
}
.subtitle.show { opacity:1; }

/* Menu */
#menu {
  position:absolute; inset:0; z-index:10;
  background: radial-gradient(ellipse at center, rgba(10,15,25,0.85), rgba(0,0,0,0.98));
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding: 6vh 6vw; text-align:center;
}
#menu.hidden { display:none; }
#menu h1 {
  font-size: clamp(28px, 8vmin, 56px); font-weight:900; letter-spacing:0.08em;
  line-height:1.05; margin-bottom: 3vh;
  text-shadow: 0 4px 30px rgba(180,30,30,0.45), 0 0 60px rgba(0,0,0,0.9);
  background: linear-gradient(180deg, #f0e8d8, #8a8070);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
#menu .tagline {
  font-size: clamp(11px, 2.8vmin, 15px); font-style:italic; color:#a8a090;
  margin-bottom: 1.5vh; max-width: 90%;
}
#menu .meta {
  font-size: clamp(10px, 2.4vmin, 13px); color:#707068; letter-spacing:0.1em;
  margin-bottom: 5vh;
}
#menu .settings {
  display:flex; gap:14px; margin-bottom: 4vh; font-size: clamp(11px,2.6vmin,14px); color:#c8c0b0;
  align-items:center; flex-wrap:wrap; justify-content:center;
}
#menu .settings label { display:flex; align-items:center; gap:6px; cursor:pointer; }
#menu .settings select {
  background:#1a1a22; color:#fff; border:1px solid #333; padding:6px 10px;
  border-radius:6px; font-size:inherit;
}
#start-btn {
  padding: 16px 40px; font-size: clamp(14px,3.5vmin,18px); font-weight:800; letter-spacing:0.15em;
  background: linear-gradient(135deg, #b02020, #5a0a0a); color:#fff;
  border:none; border-radius:8px; cursor:pointer;
  box-shadow: 0 8px 30px rgba(180,30,30,0.5), 0 0 0 1px rgba(255,255,255,0.1) inset;
  transition: transform 0.15s, box-shadow 0.15s;
  text-transform: uppercase;
}
#start-btn:active { transform: scale(0.97); }
#start-btn:hover { box-shadow: 0 10px 40px rgba(200,40,40,0.7), 0 0 0 1px rgba(255,255,255,0.15) inset; }

/* HUD */
#hud {
  position:absolute; left:0; right:0; bottom:7%; z-index:5;
  padding: 0 5%; display:none; align-items:center; gap:12px;
}
#hud.visible { display:flex; }
.hud-bar {
  display:flex; align-items:center; gap:10px; flex:1;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1); border-radius:20px;
  padding: 8px 14px;
}
#play-pause {
  background:none; border:none; color:#fff; font-size:16px; cursor:pointer;
  width:24px; text-align:center;
}
.progress {
  flex:1; height:4px; background:rgba(255,255,255,0.15); border-radius:2px;
  position:relative; cursor:pointer; overflow:hidden;
}
.progress-fill {
  position:absolute; left:0; top:0; bottom:0; width:0%;
  background: linear-gradient(90deg, #b02020, #e04040);
  transition: width 0.1s linear;
}
.time {
  font-size:11px; color:#a8a090; font-variant-numeric: tabular-nums;
  white-space: nowrap; min-width: 65px; text-align:right;
}

/* Credits */
#credits {
  position:absolute; inset:0; z-index:10;
  background: radial-gradient(ellipse at center, rgba(5,5,10,0.95), #000);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding: 6vw;
}
#credits.visible { display:flex; }
#credits h2 {
  font-size: clamp(22px, 6vmin, 40px); font-weight:900; letter-spacing:0.1em;
  margin-bottom: 4vh;
  background: linear-gradient(180deg, #e8c0a0, #8a4030);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
#credits p {
  font-size: clamp(13px, 3vmin, 18px); letter-spacing:0.15em; color:#a8a090;
  margin-bottom: 2vh; line-height:1.6;
}
#credits p.emphasis { color:#d02020; font-weight:700; font-size: clamp(15px, 3.8vmin, 22px); }
#replay-btn {
  margin-top: 5vh; padding: 14px 32px; font-size: 13px; font-weight:700;
  letter-spacing:0.15em; background: transparent; color:#fff;
  border:1px solid #555; border-radius:6px; cursor:pointer;
  text-transform: uppercase;
}
#replay-btn:active { background: rgba(255,255,255,0.1); }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="film"></canvas>
    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="fade" id="fade"></div>
    <div class="subtitle" id="subtitle"></div>
  </div>
  
  <div id="menu">
    <h1>ПОСЛЕДНИЙ<br>МАРШРУТ</h1>
    <p class="tagline">Иногда дорога домой становится дорогой к выживанию.</p>
    <p class="meta">КИНЕМАТОГРАФИЧЕСКИЙ 3D-ФИЛЬМ · 150 СЕКУНД</p>
    <div class="settings">
      <label><input type="checkbox" id="audio-toggle" checked> Звук</label>
      <select id="quality-select">
        <option value="low">LOW</option>
        <option value="medium" selected>MEDIUM</option>
        <option value="high">HIGH</option>
      </select>
    </div>
    <button id="start-btn">▶ НАЧАТЬ ФИЛЬМ</button>
  </div>
  
  <div id="hud">
    <div class="hud-bar">
      <button id="play-pause">⏸</button>
      <div class="progress" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="time" id="time">0:00 / 2:30</span>
    </div>
  </div>
  
  <div id="credits">
    <h2>ПОСЛЕДНИЙ МАРШРУТ</h2>
    <p>Артём добрался до базы.</p>
    <p class="emphasis">ЭТО БЫЛО ТОЛЬКО НАЧАЛО</p>
    <p>ПРОДОЛЖЕНИЕ СЛЕДУЕТ...</p>
    <button id="replay-btn">ПОСМОТРЕТЬ ЕЩЁ РАЗ</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* ================================================================
   ПОСЛЕДНИЙ МАРШРУТ — процедурный 3D-фильм
   Архитектура: Timeline → Scene Director → Camera/Characters/VFX
   ================================================================ */

// ---------- УТИЛИТЫ ----------
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const smoothstep = t => { t = clamp(t,0,1); return t*t*(3-2*t); };
const V3 = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);

// ---------- ГЛОБАЛЬНОЕ СОСТОЯНИЕ ----------
let renderer, scene, camera, clock;
let hero;
const zombies = [];
const zones = {};
let rain, dust, lightningGroup;
let shakeAmount = 0;
let flashIntensity = 0;

const FILM = {
  duration: 150,
  time: 0,
  playing: false,
  started: false,
  quality: 'medium',
  audioOn: true,
  lastFrameTime: 0,
};

// ---------- ПЕРСОНАЖИ: ПРОЦЕДУРНЫЙ HUMANOID ----------
function buildHumanoid(opts) {
  const {
    skinColor=0xd4a890, hairColor=0x3a2820, shirtColor=0xd8d0c0,
    jacketColor=0x1a1a22, pantsColor=0x101014, shoeColor=0x202028,
    backpackColor=0x1a1a1a, zombie=false, height=1.75,
  } = opts;

  const skin = new THREE.MeshStandardMaterial({color:skinColor, roughness:0.85});
  const hair = new THREE.MeshStandardMaterial({color:hairColor, roughness:0.95});
  const shirt = new THREE.MeshStandardMaterial({color:shirtColor, roughness:0.9});
  const jacket = new THREE.MeshStandardMaterial({color:jacketColor, roughness:0.75});
  const pants = new THREE.MeshStandardMaterial({color:pantsColor, roughness:0.85});
  const shoe = new THREE.MeshStandardMaterial({color:shoeColor, roughness:0.65});
  const pack = new THREE.MeshStandardMaterial({color:backpackColor, roughness:0.8});
  const eyeMat = new THREE.MeshStandardMaterial({color:zombie?0xaa2020:0x0a0a0a, roughness:0.3, emissive: zombie?0x330000:0x000000});

  const root = new THREE.Group();
  const s = height/1.75;

  // Hips
  const hips = new THREE.Group();
  hips.position.y = 0.92 * s;
  root.add(hips);

  // Spine/torso
  const spine = new THREE.Group();
  hips.add(spine);
  const torsoMat = zombie ? jacket : jacket;
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.17*s, 0.32*s, 6, 12), torsoMat);
  torso.position.y = 0.28*s;
  spine.add(torso);
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.09*s, 0.10*s, 0.06*s, 12), shirt);
  collar.position.y = 0.50*s;
  spine.add(collar);

  // Neck
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.045*s, 0.05*s, 0.09*s, 8), skin);
  neck.position.y = 0.57*s;
  spine.add(neck);

  // Head group
  const headG = new THREE.Group();
  headG.position.y = 0.64*s;
  spine.add(headG);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.10*s, 16, 16), skin);
  skull.scale.set(0.88, 1.08, 0.92);
  headG.add(skull);
  const hairMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.105*s, 16, 12, 0, Math.PI*2, 0, Math.PI*0.55), hair
  );
  hairMesh.position.y = 0.005*s;
  headG.add(hairMesh);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.013*s, 8, 8);
  const eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(-0.033*s, 0.015*s, 0.085*s); headG.add(eL);
  const eR = new THREE.Mesh(eyeGeo, eyeMat); eR.position.set( 0.033*s, 0.015*s, 0.085*s); headG.add(eR);
  // Brows
  const browMat = new THREE.MeshStandardMaterial({color:hairColor, roughness:1});
  const brow = new THREE.BoxGeometry(0.035*s, 0.008*s, 0.015*s);
  const bL = new THREE.Mesh(brow, browMat); bL.position.set(-0.033*s, 0.038*s, 0.088*s); headG.add(bL);
  const bR = new THREE.Mesh(brow, browMat); bR.position.set( 0.033*s, 0.038*s, 0.088*s); headG.add(bR);

  // Arms
  function makeArm(side) {
    const sh = new THREE.Group();
    sh.position.set(side*0.20*s, 0.44*s, 0);
    spine.add(sh);
    const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.045*s, 0.20*s, 4, 8), jacket);
    upper.position.y = -0.13*s; sh.add(upper);
    const elbow = new THREE.Group();
    elbow.position.y = -0.26*s; sh.add(elbow);
    const fore = new THREE.Mesh(new THREE.CapsuleGeometry(0.04*s, 0.18*s, 4, 8), jacket);
    fore.position.y = -0.11*s; elbow.add(fore);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.045*s, 8, 8), skin);
    hand.position.y = -0.22*s; elbow.add(hand);
    return {sh, elbow};
  }
  const armL = makeArm(-1);
  const armR = makeArm(1);

  // Legs
  function makeLeg(side) {
    const hj = new THREE.Group();
    hj.position.set(side*0.09*s, -0.02*s, 0);
    hips.add(hj);
    const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.065*s, 0.32*s, 4, 8), pants);
    thigh.position.y = -0.18*s; hj.add(thigh);
    const knee = new THREE.Group();
    knee.position.y = -0.38*s; hj.add(knee);
    const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.055*s, 0.30*s, 4, 8), pants);
    shin.position.y = -0.17*s; knee.add(shin);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.10*s, 0.055*s, 0.21*s), shoe);
    foot.position.set(0, -0.37*s, 0.045*s);
    knee.add(foot);
    return {hj, knee};
  }
  const legL = makeLeg(-1);
  const legR = makeLeg(1);

  // Backpack
  if (backpackColor !== null) {
    const bp = new THREE.Mesh(new THREE.BoxGeometry(0.22*s, 0.28*s, 0.13*s), pack);
    bp.position.set(0, 0.28*s, -0.17*s);
    spine.add(bp);
  }

  // Watch on left wrist
  if (!zombie) {
    const watch = new THREE.Mesh(new THREE.BoxGeometry(0.035*s, 0.015*s, 0.03*s),
      new THREE.MeshStandardMaterial({color:0x222222, roughness:0.4, metalness:0.6}));
    watch.position.y = -0.30*s;
    armL.elbow.add(watch);
  }

  // Fake shadow
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.35*s, 16),
    new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.55})
  );
  shadow.rotation.x = -Math.PI/2;
  shadow.position.y = 0.01;
  root.add(shadow);

  return {
    root,
    joints: {
      hips, spine, headG,
      shL: armL.sh, elL: armL.elbow,
      shR: armR.sh, elR: armR.elbow,
      hjL: legL.hj, knL: legL.knee,
      hjR: legR.hj, knR: legR.knee,
    },
    phase: 0,
    state: 'idle',
    height,
  };
}

// ---------- АНИМАЦИЯ HUMANOID ----------
function animateHumanoid(ch, dt, targetState) {
  ch.phase += dt * (targetState==='run'?13 : targetState==='walk'?6.5 : targetState==='zombie'?3.5 : 1.2);
  const p = ch.phase;
  const s = Math.sin(p);
  const c = Math.cos(p);
  const j = ch.joints;

  if (targetState === 'idle') {
    const breath = Math.sin(p*0.8) * 0.008;
    j.spine.rotation.x = lerp(j.spine.rotation.x, 0.02, 0.15);
    j.spine.position.y = breath;
    j.headG.rotation.x = lerp(j.headG.rotation.x, Math.sin(p*0.5)*0.02, 0.08);
    j.headG.rotation.y = lerp(j.headG.rotation.y, Math.sin(p*0.3)*0.15, 0.05);
    j.shL.rotation.x = lerp(j.shL.rotation.x, 0.05, 0.15);
    j.shR.rotation.x = lerp(j.shR.rotation.x, 0.05, 0.15);
    j.elL.rotation.x = lerp(j.elL.rotation.x, -0.15, 0.15);
    j.elR.rotation.x = lerp(j.elR.rotation.x, -0.15, 0.15);
    j.hjL.rotation.x = lerp(j.hjL.rotation.x, 0, 0.2);
    j.hjR.rotation.x = lerp(j.hjR.rotation.x, 0, 0.2);
    j.knL.rotation.x = lerp(j.knL.rotation.x, 0, 0.2);
    j.knR.rotation.x = lerp(j.knR.rotation.x, 0, 0.2);
  } else if (targetState === 'walk') {
    const sw = 0.55;
    j.hjL.rotation.x = s * sw;
    j.hjR.rotation.x = -s * sw;
    j.knL.rotation.x = Math.max(0, -c * 0.7);
    j.knR.rotation.x = Math.max(0, c * 0.7);
    j.shL.rotation.x = -s * 0.4;
    j.shR.rotation.x = s * 0.4;
    j.elL.rotation.x = -0.3 - Math.abs(s)*0.2;
    j.elR.rotation.x = -0.3 - Math.abs(s)*0.2;
    j.spine.rotation.x = 0.05;
    j.spine.position.y = Math.abs(s) * 0.015;
    j.headG.rotation.x = -0.03;
  } else if (targetState === 'run') {
    const sw = 1.0;
    j.hjL.rotation.x = s * sw;
    j.hjR.rotation.x = -s * sw;
    j.knL.rotation.x = Math.max(0, -c * 1.2);
    j.knR.rotation.x = Math.max(0, c * 1.2);
    j.shL.rotation.x = -s * 0.9;
    j.shR.rotation.x = s * 0.9;
    j.elL.rotation.x = -0.85 - Math.abs(s)*0.4;
    j.elR.rotation.x = -0.85 - Math.abs(s)*0.4;
    j.spine.rotation.x = 0.18;
    j.spine.position.y = Math.abs(s) * 0.025;
    j.headG.rotation.x = -0.18;
  } else if (targetState === 'zombie') {
    const t = p;
    const jitter = Math.sin(t*11)*0.08 + Math.sin(t*6.7)*0.06;
    j.hjL.rotation.x = Math.sin(t) * 0.35;
    j.hjR.rotation.x = -Math.sin(t) * 0.35;
    j.knL.rotation.x = Math.max(0, Math.sin(t + 0.6) * 0.5);
    j.knR.rotation.x = Math.max(0, -Math.sin(t + 0.6) * 0.5);
    j.shL.rotation.x = -0.9 + Math.sin(t)*0.15 + jitter*0.3;
    j.shR.rotation.x = -0.9 - Math.sin(t)*0.15 + jitter*0.3;
    j.elL.rotation.x = -0.6 + Math.sin(t*2)*0.15;
    j.elR.rotation.x = -0.6 - Math.sin(t*2)*0.15;
    j.spine.rotation.x = 0.28 + Math.sin(t)*0.06;
    j.spine.position.y = Math.abs(Math.sin(t*2))*0.01;
    j.headG.rotation.x = -0.1 + Math.sin(t*3)*0.18;
    j.headG.rotation.y = Math.sin(t*2.3)*0.35;
  }
}

// ---------- ОКРУЖЕНИЕ ----------
const MATS = {
  concrete: () => new THREE.MeshStandardMaterial({color:0x4a4a52, roughness:0.95}),
  darkConcrete: () => new THREE.MeshStandardMaterial({color:0x282830, roughness:0.95}),
  asphalt: () => new THREE.MeshStandardMaterial({color:0x1a1a20, roughness:0.9}),
  metal: () => new THREE.MeshStandardMaterial({color:0x3a3a42, roughness:0.5, metalness:0.7}),
  rustMetal: () => new THREE.MeshStandardMaterial({color:0x5a4030, roughness:0.85, metalness:0.4}),
  brick: () => new THREE.MeshStandardMaterial({color:0x4a3028, roughness:0.95}),
  glass: () => new THREE.MeshStandardMaterial({color:0x223344, roughness:0.15, metalness:0.4, transparent:true, opacity:0.4}),
  lightOff: () => new THREE.MeshStandardMaterial({color:0x1a1a22, roughness:0.5, emissive:0x000000}),
  lightOn: (c) => new THREE.MeshStandardMaterial({color:0x1a1a22, roughness:0.5, emissive:c, emissiveIntensity:1.2}),
  fabric: (c) => new THREE.MeshStandardMaterial({color:c, roughness:0.9}),
  emberRed: () => new THREE.MeshStandardMaterial({color:0x300000, emissive:0xff2020, emissiveIntensity:1}),
};

// ---- ШКОЛА ----
function buildSchool() {
  const g = new THREE.Group();
  g.position.set(0, 0, 0);

  // Corridor: floor / ceiling / walls
  const floor = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.1, 40), MATS.concrete());
  floor.position.set(0, -0.05, 0);
  g.add(floor);

  const ceiling = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.1, 40), MATS.darkConcrete());
  ceiling.position.set(0, 3.4, 0);
  g.add(ceiling);

  const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 3.4, 40),
    new THREE.MeshStandardMaterial({color:0x5a5048, roughness:0.9}));
  wallL.position.set(-2.25, 1.7, 0);
  g.add(wallL);

  const wallR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 3.4, 40),
    new THREE.MeshStandardMaterial({color:0x5a5048, roughness:0.9}));
  wallR.position.set(2.25, 1.7, 0);
  g.add(wallR);

  // Lockers on right wall
  const lockerMat = new THREE.MeshStandardMaterial({color:0x2a2a35, roughness:0.6, metalness:0.5});
  for (let i = 0; i < 20; i++) {

// ---------- VFX ----------
function createRain(count) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const vel = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i*3] = (Math.random()-0.5) * 60;
    pos[i*3+1] = Math.random() * 30;
    pos[i*3+2] = (Math.random()-0.5) * 60;
    vel[i] = 0.4 + Math.random()*0.4;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color:0x9ab0c8, size:0.06, transparent:true, opacity:0.5, depthWrite:false
  });
  const points = new THREE.Points(geo, mat);
  points.userData = {vel, count, active:false};
  points.frustumCulled = false;
  return points;
}

function updateRain(dt, intensity) {
  if (!rain) return;
  rain.visible = intensity > 0;
  if (!rain.visible) return;
  rain.material.opacity = 0.15 + intensity * 0.5;
  const pos = rain.geometry.attributes.position.array;
  const vel = rain.userData.vel;
  const camX = camera.position.x, camY = camera.position.y, camZ = camera.position.z;
  for (let i = 0; i < rain.userData.count; i++) {
    pos[i*3+1] -= vel[i] * 50 * dt * intensity;
    if (pos[i*3+1] < -2) {
      pos[i*3] = camX + (Math.random()-0.5)*40;
      pos[i*3+1] = camY + 20;
      pos[i*3+2] = camZ + (Math.random()-0.5)*40;
    }
  }
  rain.geometry.attributes.position.needsUpdate = true;
}

function createDust(count) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i*3] = (Math.random()-0.5)*20;
    pos[i*3+1] = Math.random()*3;
    pos[i*3+2] = (Math.random()-0.5)*20;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color:0x8a8a7a, size:0.04, transparent:true, opacity:0.35, depthWrite:false
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  return points;
}

function updateDust(dt, active) {
  if (!dust) return;
  dust.visible = active;
  if (!active) return;
  const pos = dust.geometry.attributes.position.array;
  for (let i = 0; i < pos.length/3; i++) {
    pos[i*3] += Math.sin(FILM.time + i) * 0.0008;
    pos[i*3+1] += 0.0004;
    if (pos[i*3+1] > 4) pos[i*3+1] = 0;
  }
  dust.geometry.attributes.position.needsUpdate = true;
  dust.position.set(camera.position.x, 0, camera.position.z);
}

// ---------- АУДИО (процедурное) ----------
let audioCtx = null;
let masterGain = null;
let droneOsc = null;
let droneGain = null;
let rainNode = null;
let rainGain = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.4;
    masterGain.connect(audioCtx.destination);

    // Ambient drone
    droneOsc = audioCtx.createOscillator();
    droneOsc.type = 'sawtooth';
    droneOsc.frequency.value = 55;
    droneGain = audioCtx.createGain();
    droneGain.gain.value = 0;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 200;
    droneOsc.connect(lp);
    lp.connect(droneGain);
    droneGain.connect(masterGain);
    droneOsc.start();

    // Rain (filtered noise)
    const bufSize = audioCtx.sampleRate * 2;
    const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random()*2-1) * 0.5;
    rainNode = audioCtx.createBufferSource();
    rainNode.buffer = noiseBuf;
    rainNode.loop = true;
    const rfilter = audioCtx.createBiquadFilter();
    rfilter.type = 'highpass';
    rfilter.frequency.value = 800;
    rainGain = audioCtx.createGain();
    rainGain.gain.value = 0;
    rainNode.connect(rfilter);
    rfilter.connect(rainGain);
    rainGain.connect(masterGain);
    rainNode.start();
  } catch (e) { console.warn('Audio init failed', e); }
}

function setDrone(vol, freq=55) {
  if (!droneGain) return;
  const now = audioCtx.currentTime;
  droneGain.gain.linearRampToValueAtTime(vol, now + 0.5);
  droneOsc.frequency.linearRampToValueAtTime(freq, now + 0.5);
}

function setRain(vol) {
  if (!rainGain) return;
  rainGain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.3);
}

function playThud(vol=0.3) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, now);
  osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
  osc.connect(g);
  g.connect(masterGain);
  osc.start(now);
  osc.stop(now + 0.4);
}

// ---------- КАМЕРА-ДИРЕКТОР ----------
const camTarget = new THREE.Vector3();
const camDesired = new THREE.Vector3();

function directCamera(t) {
  // Position & target per scene
  let targetFov = 50;

  if (t < 12) {
    // 0-12: Aerial approach to school
    const p = smoothstep(t / 12);
    camDesired.set(
      lerp(-30, 2, p),
      lerp(18, 1.5, p),
      lerp(30, 8, p)
    );
    camTarget.set(0, 2, 0);
    targetFov = lerp(60, 45, p);
  } else if (t < 25) {
    // 12-25: Classroom
    const p = (t - 12) / 13;
    camDesired.set(
      lerp(-9, -7, smoothstep(p)),
      1.7,
      lerp(-7, -7, p)
    );
    camTarget.set(-7, 1.5, -10);
    targetFov = 45;
  } else if (t < 42) {
    // 25-42: Panic hallway — tracking behind hero
    const p = (t - 25) / 17;
    const heroZ = lerp(-10, 5, p);
    camDesired.set(0.3, 1.7, heroZ + 3.5);
    camTarget.set(0, 1.4, heroZ - 2);
    targetFov = 55;
    shakeAmount = Math.max(shakeAmount, 0.008);
  } else if (t < 58) {
    // 42-58: Escape from school
    const p = (t - 42) / 16;
    const heroZ = lerp(5, 18, p);
    camDesired.set(lerp(0, 1.5, smoothstep(p)), 1.7, heroZ + 3);
    camTarget.set(0.5, 1.2, heroZ - 3);
    targetFov = 55;
    shakeAmount = Math.max(shakeAmount, 0.012);
  } else if (t < 77) {
    // 58-77: Street — dynamic tracking
    const p = (t - 58) / 19;
    const heroZ = lerp(-50, 20, p);
    camDesired.set(Math.sin(p * Math.PI * 3) * 1.5, 1.6, heroZ + 4);
    camTarget.set(0, 1.2, heroZ - 4);
    targetFov = 55;
    shakeAmount = Math.max(shakeAmount, 0.015);
  } else if (t < 94) {
    // 77-94: Shop interior — slow pan
    const p = (t - 77) / 17;
    camDesired.set(80 + lerp(-2.5, 1.5, smoothstep(p)), 1.6, 25 + 2.5);
    camTarget.set(80, 1.2, 25);
    targetFov = 50;
  } else if (t < 113) {
    // 94-113: Road to base — aerial rising
    const p = (t - 94) / 19;
    camDesired.set(80, lerp(2, 15, smoothstep(p)), lerp(20, 50, p));
    camTarget.set(80, 2, lerp(10, 30, p));
    targetFov = lerp(55, 65, p);
  } else if (t < 129) {
    // 113-129: Base approach
    const p = (t - 113) / 16;
    camDesired.set(160 + Math.sin(p*Math.PI) * 2, 1.7, lerp(30, 25, p));
    camTarget.set(160, 1.5, 18);
    targetFov = 55;
    shakeAmount = Math.max(shakeAmount, 0.02);
  } else if (t < 142) {
    // 129-142: Inside base
    const p = (t - 129) / 13;
    camDesired.set(lerp(159, 160, smoothstep(p)), 1.7, lerp(22, 18, p));
    camTarget.set(160, 1.4, 15);
    targetFov = 55;
  } else {
    // 142-150: Final twist — close-up on face
    const p = (t - 142) / 8;
    camDesired.set(160 + lerp(0, 0.3, p), 1.7, lerp(17, 16, p));
    camTarget.set(160, 1.55, 15);
    targetFov = lerp(55, 32, smoothstep(p));
  }

  // Smooth camera
  camera.position.lerp(camDesired, 0.15);
  camTarget.lerp(camTarget, 0.2);
  camera.lookAt(camTarget);
  if (Math.abs(camera.fov - targetFov) > 0.1) {
    camera.fov = lerp(camera.fov, targetFov, 0.1);
    camera.updateProjectionMatrix();
  }
}

// ---------- HERO / ZOMBIE MANAGEMENT ----------
function heroSet(x, y, z, rotY = 0) {
  hero.root.position.set(x, y, z);
  hero.root.rotation.y = rotY;
  hero.root.visible = true;
}

function zombieSet(idx, x, y, z, rotY, state='zombie') {
  const z = zombies[idx];
  if (!z) return;
  z.root.position.set(x, y, z);
  z.root.rotation.y = rotY;
  z.root.visible = true;
  z.state = state;
}

function hideAllZombies() {
  zombies.forEach(z => z.root.visible = false);
}

// ---------- СЦЕНАРИЙ / DIRECTOR ----------
function updateScene(t, dt) {
  hideAllZombies();
  hero.root.visible = false;

  const zone = (() => {
    if (t < 58) return zones.school;
    if (t < 77) return zones.city;
    if (t < 94) return zones.shop;
    if (t < 113) return zones.city;
    return zones.base;
  })();

  // toggle visibility
  for (const k in zones) zones[k].visible = (zones[k] === zone);

  // Fog per scene
  if (t < 58) {
    scene.fog.color.setHex(0x1a1a22);
    scene.fog.density = 0.02;
    scene.background.setHex(0x1a1a22);
  } else if (t < 113) {
    scene.fog.color.setHex(0x151820);
    scene.fog.density = 0.025;
    scene.background.setHex(0x151820);
  } else {
    scene.fog.color.setHex(0x0a0a12);
    scene.fog.density = 0.03;
    scene.background.setHex(0x0a0a12);
  }

  // Rain intensity
  const rainIntensity =
    (t >= 58 && t < 94) ? 0.7 :
    (t >= 94 && t < 113) ? 1.0 :
    (t >= 113) ? 0.5 : 0;
  updateRain(dt, rainIntensity);

  // Dust for indoor
  updateDust(dt, t < 58 || (t >= 77 && t < 94));

  // Ambient fog lights
  setDrone(
    t < 12 ? 0.15 : t < 25 ? 0.2 : t < 42 ? 0.35 : t < 58 ? 0.4 :
    t < 77 ? 0.45 : t < 94 ? 0.3 : t < 113 ? 0.5 : t < 142 ? 0.35 : 0.6,
    t < 12 ? 55 : t < 42 ? 60 : t < 77 ? 70 : t < 113 ? 65 : 55
  );
  setRain(rainIntensity * 0.15);

  // Subtitles helper
  const sub = (txt) => {
    const el = document.getElementById('subtitle');
    if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('show', !!txt);
  };

  // ===== SCENE LOGIC =====
  if (t < 12) {
    // Opening — hero not visible (yet), just establishing
    sub('');
    // flicker distant ambient
    flashIntensity = 0;

  } else if (t < 25) {
    // Classroom: hero sits at desk, camera observes
    heroSet(-7, 0, -10, Math.PI * 0.15);
    hero.state = 'idle';
    animateHumanoid(hero, dt, 'idle');
    // Car crash flash at t~18
    if (t > 17 && t < 17.3) {
      flashIntensity = 1.5;
    } else {
      flashIntensity *= 0.9;
    }
    if (t > 17.2 && t < 17.4) playThud(0.4);
    sub(t > 21.5 ? 'ВНИМАНИЕ! НЕ ПОКИДАЙТЕ ПОМЕЩЕНИЯ.' : '');
    hero.root.rotation.y = Math.PI * 0.15 + Math.sin(t) * 0.15;

  } else if (t < 42) {
    // Panic hallway — hero runs forward (z increases)
    const p = (t - 25) / 17;
    const heroZ = lerp(-10, 5, p);
    heroSet(0, 0, heroZ, 0);
    hero.state = 'run';
    animateHumanoid(hero, dt, 'run');
    // zombies chase
    for (let i = 0; i < 3; i++) {
      zombieSet(i, Math.sin(i*2) * 0.8, 0, heroZ - 5 - i*2.5, 0, 'zombie');
      animateHumanoid(zombies[i], dt, 'zombie');
    }
    shakeAmount = Math.max(shakeAmount, 0.008);
    sub(t < 32 ? 'АРТЁМ, БЕГИ!' : '');

  } else if (t < 58) {
    // Escape — hero runs to exit
    const p = (t - 42) / 16;
    const heroZ = lerp(5, 18, p);
    heroSet(0.3 * Math.sin(p*3), 0, heroZ, 0);
    hero.state = 'run';
    animateHumanoid(hero, dt, 'run');
    for (let i = 0; i < 2; i++) {
      zombieSet(i, -0.8 + i*1.6, 0, heroZ - 4 - i*3, 0, 'zombie');
      animateHumanoid(zombies[i], dt, 'zombie');
    }
    shakeAmount = Math.max(shakeAmount, 0.012);
    sub(t < 50 ? 'ВСЕМ ГРАЖДАНАМ — К ВОЕННОМУ ПЕРИМЕТРУ!' : '');

  } else if (t < 77) {
    // Street
    const p = (t - 58) / 19;
    const heroZ = lerp(-50, 20, p);
    heroSet(80 + Math.sin(p*5)*0.5, 0, heroZ, Math.PI * 0 + Math.sin(p*8)*0.05);
    // Note: hero in city zone, x offset 80
    hero.root.position.x = 80 + Math.sin(p*5)*0.5;
    hero.root.position.z = heroZ;
    hero.state = 'run';
    animateHumanoid(hero, dt, 'run');
    // zombies scattered in street
    for (let i = 0; i < 4; i++) {
      const zz = heroZ - 6 - i * 4;
      zombieSet(i, 80 + (Math.random()-0.5)*4, 0, zz, Math.PI + Math.random()*0.3, 'zombie');
      animateHumanoid(zombies[i], dt, 'zombie');
    }
    shakeAmount = Math.max(shakeAmount, 0.01);
    sub(t > 62 && t < 70 ? 'НЕ ОСТАНАВЛИВАЙСЯ.' : '');

  } else if (t < 94) {
    // Shop
    const p = (t - 77) / 17;
    heroSet(80, 0, 25 + 3, Math.PI);
    hero.state = 'idle';
    animateHumanoid(hero, dt, 'idle');
    // flicker
    const lamp = zones.shop.getObjectByName('flickerLamp');
    const fl = zones.shop.getObjectByName('flickerLight');
    const flick = Math.sin(t*15) * 0.5 + 0.5;
    if (lamp) lamp.material.emissiveIntensity = 0.3 + flick * 0.8;
    if (fl) fl.intensity = 0.3 + flick * 0.7;
    // one zombie appears at t > 87
    if (t > 87) {
      zombieSet(0, 80, 0, 25 - 3, 0, 'zombie');
      animateHumanoid(zombies[0], dt, 'zombie');
    }
    sub(t < 82 ? '«ЕСЛИ ТЫ ЖИВ — ИДИ К СЕВЕРНОМУ ПЕРИМЕТРУ»' : '');

  } else if (t < 113) {
    // Road to base — aerial but hero visible small
    const p = (t - 94) / 19;
    const heroZ = lerp(20, 50, p);
    heroSet(80, 0, heroZ, 0);
    hero.root.position.x = 80;
    hero.root.position.z = heroZ;
    hero.state = 'run';
    animateHumanoid(hero, dt, 'run');
    for (let i = 0; i < 3; i++) {
      zombieSet(i, 80 + (Math.random()-0.5)*6, 0, heroZ + 8 + i*5, 0, 'zombie');
      animateHumanoid(zombies[i], dt, 'zombie');
    }
    sub(t < 105 ? 'ЭТО НАШ ЕДИНСТВЕННЫЙ ШАНС.' : '');

  } else if (t < 129) {
    // Base approach
    const p = (t - 113) / 16;
    const heroZ = lerp(30, 22, p);
    heroSet(160, 0, heroZ, Math.PI);
    hero.state = 'run';
    animateHumanoid(hero, dt, 'run');
    for (let i = 0; i < 4; i++) {
      zombieSet(i, 160 + (Math.random()-0.5)*8, 0, heroZ + 6 + i*2.5, Math.PI, 'zombie');
      animateHumanoid(zombies[i], dt, 'zombie');
    }
    // Open gate at t>125
    const gateL = zones.base.getObjectByName('gateL');
    const gateR = zones.base.getObjectByName('gateR');
    if (gateL && gateR) {
      const open = clamp((t - 125) / 2, 0, 1);
      gateL.rotation.y = -open * Math.PI * 0.5;
      gateR.rotation.y = open * Math.PI * 0.5;
    }
    shakeAmount = Math.max(shakeAmount, 0.02);
    sub(t < 122 ? 'БЫСТРЕЕ! СЮДА!' : '');

  } else if (t < 142) {
    // Inside base
    heroSet(160, 0, 15, Math.PI);
    hero.state = 'idle';
    animateHumanoid(hero, dt, 'idle');
    sub(t < 137 ? 'Ты добрался. Теперь ты в безопасности.' : 'КОД КРАСНЫЙ. ВНУТРЕННИЙ ПЕРИМЕТР ЗАРАЖЁН.');

  } else {
    // Final twist
    const p = (t - 142) / 8;
    heroSet(160, 0, 15, Math.PI + Math.sin(t*2)*0.1);
    hero.state = 'idle';
    animateHumanoid(hero, dt, 'idle');
    // head slowly turns
    hero.joints.headG.rotation.y = Math.sin((t - 142) * 0.5) * 0.4;
    sub(t > 146 ? '' : '');
    // fade out
  }

  // Camera
  directCamera(t);
}

// ---------- UI ----------
function fmtTime(s) {
  s = Math.max(0, Math.floor(s));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

function updateUI() {
  const fill = document.getElementById('progress-fill');
  const timeEl = document.getElementById('time');
  if (fill) fill.style.width = (FILM.time / FILM.duration * 100) + '%';
  if (timeEl) timeEl.textContent = `${fmtTime(FILM.time)} / ${fmtTime(FILM.duration)}`;
}

// ---------- ОСНОВНОЙ ЦИКЛ ----------
function loop(now) {
  requestAnimationFrame(loop);

  if (!FILM.started) return;

  const dt = FILM.playing ? Math.min(0.05, (now - FILM.lastFrameTime) / 1000) : 0;
  FILM.lastFrameTime = now;

  if (FILM.playing) {
    FILM.time += dt;
    if (FILM.time >= FILM.duration) {
      FILM.time = FILM.duration;
      FILM.playing = false;
      showCredits();
    }
  }

  // Update scene
  if (FILM.playing || FILM.time > 0) {
    updateScene(FILM.time, dt);

    // Camera shake
    if (shakeAmount > 0.0001) {
      camera.position.x += (Math.random() - 0.5) * shakeAmount;
      camera.position.y += (Math.random() - 0.5) * shakeAmount;
      shakeAmount *= 0.92;
      if (shakeAmount < 0.0005) shakeAmount = 0;
    }

    // Flash
    if (flashIntensity > 0.01) {
      scene.userData.ambient.intensity = 0.6 + flashIntensity * 2;
      flashIntensity *= 0.85;
    } else {
      scene.userData.ambient.intensity = 0.6;
    }

    // Fade for scene transitions
    const fade = document.getElementById('fade');
    const cuts = [12, 25, 42, 58, 77, 94, 113, 129, 142];
    let fadeVal = 0;
    for (const c of cuts) {
      const d = Math.abs(FILM.time - c);
      if (d < 0.4) fadeVal = Math.max(fadeVal, 1 - d / 0.4);
    }
    // Also fade at the very end
    if (FILM.time > 148) fadeVal = Math.max(fadeVal, (FILM.time - 148) / 2);
    fade.style.opacity = fadeVal;
  }

  // Flicker global lighting a little
  scene.userData.dir.intensity = 0.75 + Math.sin(now * 0.001) * 0.05;

  renderer.render(scene, camera);
  updateUI();
}

// ---------- RESIZE ----------
function onResize() {
  const stage = document.getElementById('stage');
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, FILM.quality === 'low' ? 1 : FILM.quality === 'high' ? 2 : 1.5));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

// ---------- CREDITS / RESTART ----------
function showCredits() {
  document.getElementById('hud').classList.remove('visible');
  document.getElementById('credits').classList.add('visible');
  document.getElementById('subtitle').classList.remove('show');
}

function restartFilm() {
  FILM.time = 0;
  FILM.playing = true;
  FILM.lastFrameTime = performance.now();
  document.getElementById('credits').classList.remove('visible');
  document.getElementById('hud').classList.add('visible');
  document.getElementById('menu').classList.add('hidden');
  camera.position.set(-30, 18, 30);
}

// ---------- INIT ----------
function init() {
  const canvas = document.getElementById('film');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setClearColor(0x000000, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a22);
  scene.fog = new THREE.FogExp2(0x1a1a22, 0.02);

  camera = new THREE.PerspectiveCamera(50, 9/16, 0.1, 500);
  camera.position.set(-30, 18, 30);
  camera.lookAt(0, 2, 0);

  // Lights
  const ambient = new THREE.AmbientLight(0x556688, 0.6);
  scene.add(ambient);
  const dir = new THREE.DirectionalLight(0x99b0d0, 0.8);
  dir.position.set(20, 40, 20);
  scene.add(dir);
  scene.userData.ambient = ambient;
  scene.userData.dir = dir;

  // Build zones
  zones.school = buildSchool();
  zones.city = buildCity();
  zones.shop = buildShop();
  zones.base = buildBase();
  scene.add(zones.school, zones.city, zones.shop, zones.base);

  // Hero
  hero = buildHumanoid({
    skinColor:0xd4a890, hairColor:0x3a2820, shirtColor:0xd8d0c0,
    jacketColor:0x1a1a22, pantsColor:0x101014, shoeColor:0x202028,
    backpackColor:0x1a1a1a, zombie:false,
  });
  hero.root.visible = false;
  scene.add(hero.root);

  // Zombies
  for (let i = 0; i < 8; i++) {
    const z = buildHumanoid({
      skinColor: 0x8a9a7a, hairColor:0x1a1510, shirtColor:0x5a4a42,
      jacketColor:0x2a2018, pantsColor:0x1a1512, shoeColor:0x101010,
      backpackColor:null, zombie:true, height: 1.65 + Math.random()*0.15,
    });
    z.root.visible = false;
    scene.add(z.root);
    zombies.push(z);
  }

  // VFX
  rain = createRain(FILM.quality === 'low' ? 500 : 1500);
  scene.add(rain);
  dust = createDust(FILM.quality === 'low' ? 150 : 400);
  scene.add(dust);

  // Resize
  window.addEventListener('resize', onResize);
  onResize();

  // Init UI
  initUI();
  document.getElementById('film').style.background = '#000';

  // Start render loop
  requestAnimationFrame(loop);
}

function initUI() {
  document.getElementById('start-btn').addEventListener('click', () => {
    const quality = document.getElementById('quality-select').value;
    FILM.quality = quality;
    FILM.audioOn = document.getElementById('audio-toggle').checked;
    if (FILM.audioOn) initAudio();
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('hud').classList.add('visible');
    FILM.started = true;
    FILM.playing = true;
    FILM.time = 0;
    FILM.lastFrameTime = performance.now();
  });

  document.getElementById('play-pause').addEventListener('click', () => {
    if (FILM.time >= FILM.duration) { restartFilm(); return; }
    FILM.playing = !FILM.playing;
    FILM.lastFrameTime = performance.now();
    document.getElementById('play-pause').textContent = FILM.playing ? '⏸' : '▶';
  });

  document.getElementById('progress').addEventListener('click', (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    FILM.time = clamp(pct, 0, 1) * FILM.duration;
    FILM.lastFrameTime = performance.now();
    // Force a re-evaluation by making sure scene updates on next frame
    if (!FILM.playing) updateScene(FILM.time, 0);
  });

  document.getElementById('replay-btn').addEventListener('click', restartFilm);
}

// ---------- GO ----------
init();
</script>
